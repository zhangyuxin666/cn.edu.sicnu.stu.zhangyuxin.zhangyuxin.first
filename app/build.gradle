plugins {
    id 'com.android.application'
}

android {
    namespace 'edu.sicnu.multilingualhello'
    compileSdk 37

    defaultConfig {
        applicationId 'edu.sicnu.multilingualhello'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
